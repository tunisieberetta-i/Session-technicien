<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Embedded Content</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
    }
    
    /* NOUVEAU : Style pour l'écran de chargement */
    #ecran-chargement {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1a1a1a; /* Fond sombre pour correspondre à votre app */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9998; /* Juste en dessous de la couche invisible */
    }
    
    /* Animation pour faire tourner le logo */
    .spinner {
      width: 80px;
      height: 80px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  
  <!-- NOUVEAU : Écran de chargement avec votre logo -->
  <div id="ecran-chargement">
    <img src="nom_de_votre_image.png" alt="Chargement..." class="spinner">
  </div>

  <div id="couche-invisible" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;"></div>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbwIm6ne03duxQH7JwPFV8WnUsQihhzgHY_Gh0b2j-50dBD_t3JdwFDnYYkFstO1cYGO/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    const coucheInvisible = document.getElementById('couche-invisible');
    
    // NOUVEAU : Fait disparaître le chargement quand l'iframe a terminé de charger
    const iframe = document.querySelector('iframe');
    const ecranChargement = document.getElementById('ecran-chargement');
    
    iframe.onload = function() {
      ecranChargement.style.display = 'none';
    };

    coucheInvisible.addEventListener('click', function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });

      coucheInvisible.style.display = 'none';
    });
  </script>
</body>
</html>
