<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Embedded Content</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; 
    }
    
    /* STYLE DU CHARGEMENT (Créé entièrement en code) */
    #ecran-chargement {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f8f9fa; /* Fond clair */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9998;
    }
    
    .spinner-container {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Le cercle qui tourne */
    .spinner-cercle {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px dotted #555; /* Crée l'effet de points comme sur votre capture */
      border-top-color: #000;  /* Point plus foncé en haut */
      animation: spin 1.5s linear infinite; /* Fait tourner le cercle */
    }

    /* Le texte au centre (qui ne tourne pas) */
    .spinner-texte {
      position: absolute;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  
  <!-- NOUVEAU : Écran de chargement codé en HTML/CSS -->
  <div id="ecran-chargement">
    <div class="spinner-container">
      <div class="spinner-cercle"></div>
      <div class="spinner-texte">loading......</div>
    </div>
  </div>

  <div id="couche-invisible" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;"></div>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbwIm6ne03duxQH7JwPFV8WnUsQihhzgHY_Gh0b2j-50dBD_t3JdwFDnYYkFstO1cYGO/exec"
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    const coucheInvisible = document.getElementById('couche-invisible');
    const iframe = document.querySelector('iframe');
    const ecranChargement = document.getElementById('ecran-chargement');
    
    // Fait disparaître l'écran de chargement quand l'application Apps Script a fini de charger
    iframe.onload = function() {
      ecranChargement.style.display = 'none';
    };

    coucheInvisible.addEventListener('click', function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });

      coucheInvisible.style.display = 'none';
    });
  </script>
</body>
</html>
